[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-profiler"
version = "0.3.2"
description = "Local laser beam profiler: GenICam camera acquisition via Aravis, D4σ moment analysis and a documented partial uncertainty budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ulrich Warring"}]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13"]
keywords = ["beam profiling", "laser", "D4sigma", "ISO 11146", "GenICam", "Aravis", "measurement uncertainty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
beam-profiler = "beam_profiler.server:main"

[project.urls]
Repository = "https://github.com/uwarring82/beam-profiler"

[tool.setuptools]
packages = ["beam_profiler", "beam_profiler.cameras"]

[tool.setuptools.package-data]
beam_profiler = ["static/*"]
